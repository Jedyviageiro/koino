databases:
  - name: koino-db
    databaseName: koino
    user: koino

services:
  - type: web
    name: koino-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    disk:
      name: koino-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: koino-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: BATTLE_QUESTION_BACKUP_PATH
        value: /app/data/battle-question-catalog.generated.json
      - key: BIBLE_LICENSED_IMPORT_ENABLED
        value: "true"
      - key: BIBLE_LICENSED_RIGHTS_CONFIRMED
        value: "true"
      - key: BIBLE_LICENSED_SOURCE_DIRECTORY
        value: /app/seed-data/licensed-bibles
      - key: BIBLE_LICENSED_COPYRIGHT_NOTICE
        value: New International Version (NIV). Used under license.
