spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/koino_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings to automatically create table based on models/entities created
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Override JWT_SECRET in every deployed environment. The value must be a Base64-encoded
# secret containing at least 32 bytes for HS256.
security.jwt.secret=${JWT_SECRET:a29pbm8tZGV2ZWxvcG1lbnQtand0LXNlY3JldC1jaGFuZ2UtbWUtMjAyNg==}
security.jwt.expiration=${JWT_EXPIRATION:PT24H}
security.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:PT30M}
security.email-verification.expiration=${EMAIL_VERIFICATION_EXPIRATION:PT24H}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.google.client-id=${CLIENT_ID:}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

gemini.api-key=${GEMINI_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
devotional.backfill.enabled=${DEVOTIONAL_BACKFILL_ENABLED:true}
devotional.backfill.initial-delay=${DEVOTIONAL_BACKFILL_INITIAL_DELAY:PT20S}
devotional.backfill.delay=${DEVOTIONAL_BACKFILL_DELAY:PT1S}
devotional.backfill.horizon-days=${DEVOTIONAL_BACKFILL_HORIZON_DAYS:14}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_USERNAME:no-reply@koino.app}

battle.questions.backup-path=${BATTLE_QUESTION_BACKUP_PATH:/app/data/battle-question-catalog.generated.json}
battle.questions.gemini.enabled=${BATTLE_QUESTION_GEMINI_ENABLED:true}
battle.questions.target-per-tier=${BATTLE_QUESTION_TARGET_PER_TIER:40}
battle.questions.gemini.initial-delay-ms=${BATTLE_QUESTION_INITIAL_DELAY_MS:45000}
battle.questions.gemini.delay-ms=${BATTLE_QUESTION_DELAY_MS:120000}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
