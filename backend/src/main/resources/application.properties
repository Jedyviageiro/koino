spring.application.name=backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:koino_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework

# JWT_SECRET is required and must be a Base64-encoded value containing at
# least 32 decoded bytes.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:PT24H}
security.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:PT30M}
security.email-verification.expiration=${EMAIL_VERIFICATION_EXPIRATION:PT24H}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.google.client-id=${CLIENT_ID:}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

gemini.api-key=${GEMINI_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
devotional.backfill.enabled=${DEVOTIONAL_BACKFILL_ENABLED:true}
devotional.backfill.initial-delay=${DEVOTIONAL_BACKFILL_INITIAL_DELAY:PT20S}
devotional.backfill.delay=${DEVOTIONAL_BACKFILL_DELAY:PT1S}
devotional.backfill.horizon-days=${DEVOTIONAL_BACKFILL_HORIZON_DAYS:14}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@koino.app}}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.resend-api-url=${RESEND_API_URL:https://api.resend.com}

battle.questions.backup-path=${BATTLE_QUESTION_BACKUP_PATH:/app/data/battle-question-catalog.generated.json}
battle.questions.bootstrap-path=${BATTLE_QUESTION_BOOTSTRAP_PATH:/app/seed-data/battle-question-catalog.generated.json}
battle.questions.gemini.enabled=${BATTLE_QUESTION_GEMINI_ENABLED:true}
battle.questions.target-per-tier=${BATTLE_QUESTION_TARGET_PER_TIER:150}
battle.questions.gemini.initial-delay-ms=${BATTLE_QUESTION_INITIAL_DELAY_MS:45000}
battle.questions.gemini.delay-ms=${BATTLE_QUESTION_DELAY_MS:45000}

bible.licensed-import.enabled=${BIBLE_LICENSED_IMPORT_ENABLED:false}
bible.licensed-import.rights-confirmed=${BIBLE_LICENSED_RIGHTS_CONFIRMED:false}
bible.licensed-import.source-directory=${BIBLE_LICENSED_SOURCE_DIRECTORY:/app/data/licensed-bibles}
bible.licensed-import.version-code=${BIBLE_LICENSED_VERSION_CODE:NIV}
bible.licensed-import.version-name=${BIBLE_LICENSED_VERSION_NAME:New International Version}
bible.licensed-import.copyright-notice=${BIBLE_LICENSED_COPYRIGHT_NOTICE:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}

spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
